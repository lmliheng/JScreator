# JScreator 后端 + MySQL 8.0 一键编排
#
#
# 设计说明：
# 1. 后端镜像由根目录 Dockerfile 构建，标签沿用 js-creator:dev；容器内监听 80，宿主机映射到 7000。
# 2. .env 里的变量已全部显式列在 app.environment 下（不再用 env_file 隐式透传），取值由 Compose
#    自动加载项目根目录 .env 做 ${} 替换：.env 是唯一的值来源，本文件里不出现任何密钥。
# 3. .dockerignore 排除了 .env（镜像里没有配置文件），运行期变量全部由下面的 environment 注入。
# 4. fastweb_test 的 SQL dump 挂在 /docker-entrypoint-initdb.d，仅在数据卷为空的首启动时导入。
# 5. 宿主机端口可覆盖：APP_PORT（默认 7000）、MYSQL_PORT（默认 3308，
#    用来避开本机 3306 的 mysqld 和 3307 上已有的 mysql8 容器）。
#

name: jscreator

services:
  mysql:
    image: mysql:8.0
    container_name: js-mysql
    restart: unless-stopped
    environment:
      # 后端用 DB_USER=root + DB_PASSWORD 连接，所以 root 密码必须与之一致，这里直接复用同一个变量
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在项目根目录 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-fastweb_test}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 只读挂载，首次初始化时自动导入sql
      - ./Backend/src/infra/database/fastweb_test-2026-09-09_094207-dump.sql:/docker-entrypoint-initdb.d/01-fastweb_test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: js-creator:dev
    container_name: js
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # 不要加 DUMP_BASELINE：server.ts 检测到它会导出接口清单后直接 process.exit(0)，容器会立刻退出
    environment:
      # ---------- 服务 / 前端白名单 ----------
      NODE_ENV: production
      # .env 里的 PORT=7000 是宿主机端口，容器内必须监听 80（对应 Dockerfile 的 EXPOSE 80）
      PORT: "80"
      # CORS 白名单：.env 里只有 FRONTEND_URL(单数，GitHub OAuth 回跳用)，接口白名单变量是 FRONTEND_URLS
      FRONTEND_URLS: ${FRONTEND_URLS:-http://127.0.0.1:5173,http://127.0.0.1:8085}

      # ---------- MySQL ----------
      # 容器里不能用 127.0.0.1 连数据库，指向 compose 网络中的服务名；DB_PORT 是容器内端口，不是宿主机 3308
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?请在项目根目录 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # ---------- JWT / 应用 ----------
      JWT_SECRET: ${JWT_SECRET}
      APP_SECRET: ${APP_SECRET}

      # ---------- 邮件 SMTP（126）----------
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL}

      # ---------- GitHub OAuth ----------
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}

      # ---------- 阿里云 OSS ----------
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}

      # ---------- LLM ----------
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      # 代码里会读但 .env 没配，用默认值兜底
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
     
    ports:
      - "${APP_PORT:-7000}:80"
    healthcheck:
      # 无 /health 路由，用 fetch 探活：只要能建连（含 404）即视为存活，网络错误才算失败
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql-data:
